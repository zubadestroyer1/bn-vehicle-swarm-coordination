[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bn-vehicle-swarm-coordination"
version = "0.2.0"
description = "City-scale autonomous vehicle swarm coordination via neurally updated Dynamic Bayesian Networks in SUMO"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "eclipse-sumo==1.28.0",
    "sumo-data==1.28.0",
    "libsumo==1.28.0",
    "traci==1.28.0",
    "sumolib==1.28.0",
    "torch==2.15.0",
    "scipy==1.18.1",
    "numpy>=2.0,<3",
    "matplotlib>=3.8,<4",
    "pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
swarm = "swarm.cli:main"

[tool.setuptools.packages.find]
include = ["swarm*"]

[tool.setuptools.package-data]
swarm = [
    "viz/templates/*",
    "viz/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
