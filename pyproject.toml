[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bn-vehicle-swarm-coordination"
version = "0.1.0"
description = "Neurally updated Bayesian networks for uncertain intersection coordination"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.7,<4", "pillow>=10"]

[project.scripts]
swarm = "swarm.cli:main"

[tool.setuptools.packages.find]
include = ["swarm*"]

[tool.setuptools.package-data]
swarm = ["replay.html"]
